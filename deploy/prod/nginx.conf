server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location = /daily-insights.json { alias /srv/public/daily-insights.json; add_header Cache-Control "no-cache"; }
  location /guide/workbuddy-news/ { alias /srv/public/guide/workbuddy-news/; index index.html; add_header Cache-Control "no-cache"; }
  location = /setup { proxy_pass http://wb-bff:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location = /setup/ { proxy_pass http://wb-bff:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location = /healthz { proxy_pass http://wb-bff:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /i/ { proxy_pass http://wb-bff:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_buffering off; }
  location /api/session/ { proxy_pass http://wb-bff:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_buffering off; }
  location = /api/tasks { proxy_pass http://wb-bff:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /api/tasks/ { proxy_pass http://wb-bff:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_buffering off; }
  location = /api/models { proxy_pass http://wb-bff:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location = /api/model-check { proxy_pass http://wb-bff:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /download/task/ { proxy_pass http://wb-bff:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /bin/ { proxy_pass http://wb-bff:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /api/portal/ {
    proxy_pass http://wb-bff:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /v1/ {
    proxy_pass http://wb-bff:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
