<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>一键配置 Agent · WorkBuddy</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:#26372f;background:#f3f7f4}*{box-sizing:border-box}body{margin:0;padding:24px;min-height:100vh;background:radial-gradient(circle at 80% 15%,#e3f9e9,transparent 35%),#f3f7f4}main{max-width:640px;margin:7vh auto 0;padding:36px;background:white;border:1px solid #e1eae4;border-radius:22px;box-shadow:0 20px 50px #25452e15}header{display:flex;align-items:center;gap:12px;color:#008c70;font-weight:700}.logo{display:grid;place-items:center;width:44px;height:44px;color:#fff;background:#08bf99;border-radius:12px;font-size:23px}h1{font-size:clamp(30px,5vw,40px);line-height:1.22;margin:27px 0 10px}p{color:#6b7b71;font-size:16px;line-height:1.7}label{display:block;font-size:16px;font-weight:600;margin-top:25px}input[type=text]{display:block;width:100%;font:inherit;font-size:17px;padding:15px;border:1px solid #cfdfd3;border-radius:10px;margin-top:9px}input:focus{outline:3px solid #b9efdb;border-color:#08ac85}.agree{display:flex;gap:9px;align-items:flex-start;font-size:15px;font-weight:400;line-height:1.6;margin:18px 0 24px}.agree input{width:18px;height:18px;accent-color:#08ad86;flex:none}button{border:0;border-radius:10px;background:#05a982;color:#fff;font-size:17px;font-weight:700;padding:15px;width:100%;cursor:pointer}button:disabled{opacity:.55;cursor:default}#error{color:#b34231;background:#fff2ee;border:1px solid #f0d1c8;padding:12px;border-radius:9px;margin-top:16px}footer{max-width:640px;margin:22px auto;font-size:14px;line-height:1.7;color:#75847b}a{color:#058d6b}a:focus-visible,button:focus-visible{outline:3px solid #09b38c;outline-offset:3px}@media(max-width:600px){body{padding:14px}main{padding:25px;margin-top:3vh}}
</style></head><body><main><header><span class="logo">W</span>WorkBuddy · 一键配置</header><h1>输入兑换码，开始配置</h1><p>自动接入当前平台可用模型；接下来选择模型、客户端和系统，下载安全配置安装助手。</p><form id="form"><label for="code">你的兑换码<input type="text" id="code" placeholder="例如 wb5k-xxxxxxxxxxxxxxxx" autocomplete="off" spellcheck="false" required></label><label class="agree"><input id="agreed" type="checkbox" required>我确认激活此兑换码，并理解安装脚本会先备份配置、修改选中的客户端并尝试重启。</label><button id="submit" type="submit">继续选择模型 →</button><div id="error" role="alert" hidden></div></form></main><footer>兑换码只用来获取当前会员授权；不把 API Key 放在分享链接中。通过此页面激活后开始计算套餐有效期。<a href="/">返回平台首页</a></footer>
<script>
const params=new URLSearchParams(location.search), prefill=params.get('code');
if(prefill)document.querySelector('#code').value=prefill;
if(location.search)history.replaceState(null,'',location.pathname);
document.querySelector('#form').addEventListener('submit',async event=>{
  event.preventDefault();const button=document.querySelector('#submit'),error=document.querySelector('#error');error.hidden=true;button.disabled=true;button.textContent='正在验证兑换码…';
  try{const response=await fetch('/api/portal/oneclick/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.querySelector('#code').value,agreed:document.querySelector('#agreed').checked})});const result=await response.json();if(!response.ok)throw new Error(result.message||'激活失败');location.assign(result.data.url)}catch(reason){error.textContent=reason.message;error.hidden=false;button.disabled=false;button.textContent='继续选择模型 →'}
});
</script></body></html>
